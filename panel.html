<!DOCTYPE html>
<html>
  <head>
    <title>open-os local LLM</title>
    <link rel="stylesheet" id="theme" href="themes/dark-modern/dark-modern.css">
    <script src="lib/marked.min.js"
    crossorigin="anonymous"></script>
  </head>
  <body>
    <h1 id="openos-header"><b>open-os</b> LLM Browser Extension</h1>
    <p id="settings">NOT INITIALIZED</p>
    <div id="chatlog"><div class="chat-system" id="system-status">Connecting...</div></div>
    <div id="input-area">
      <input type="text" id="prompt" class="caret" placeholder="Type here and hit [enter]">
      <button id="submit">send</button>
      <button id="options">options</button>
      <select class="form-select" id="model-select" style="width: auto;"></select>
    </div>

    <script src="open-os.js"></script>
  </body>
</html>
